<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
	{{- partial "head.html" . -}}
	<body>
		{{- partial "header.html" . -}}
		<main id="content">
			{{- block "main" . }}{{- end }}
		</main>
		{{- partial "footer.html" . -}}
		<div id="lightbox" aria-hidden="true">
			<img src="" alt="Expanded article image" id="lightboxImage">
			<button id="closeButton" type="button" aria-label="Close image">&times;</button>
		</div>
		<script type="text/javascript" src="/js/lightbox.js" defer></script>
	</body>
</html>
