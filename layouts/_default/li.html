<li class="post-list-item">
    {{ if not .Date.IsZero }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ end }}
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.summary }}
    <p>{{ . }}</p>
    {{ else }}
    {{ with .Summary }}
    <p>{{ . | plainify | truncate 150 }}</p>
    {{ end }}
    {{ end }}
</li>
